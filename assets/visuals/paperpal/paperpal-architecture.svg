<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1040" viewBox="0 0 1200 1040" role="img" aria-labelledby="title desc"><title id="title">PaperPal: one foundation, three reading workflows</title><desc id="desc">Proposed architecture. PDF upload, extraction, MongoDB, page-aware chunks, MiniLM, ChromaDB. Questions use retrieved evidence and a planned OpenAI API extension to deliver grounded answers in Streamlit. MongoDB supplies BART-base summaries. FastAPI orchestrates services packaged with Docker.</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" fill="none" stroke="#8a96a7" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.label{font-size:12px;font-weight:600;letter-spacing:1px}.name{font-size:20px;font-weight:600;letter-spacing:-.4px}</style></defs><rect width="1200" height="1040" rx="28" fill="#f6f7f9"/><rect x="1" y="1" width="1198" height="1038" rx="28" fill="none" stroke="#e0e5eb"/>
<text x="56" y="57" class="label" fill="#426b93">PAPERPAL / SYSTEM DESIGN</text><text x="56" y="110" font-size="38" font-weight="650" letter-spacing="-1.2" fill="#1d2838">One foundation. Three reading workflows.</text><text x="56" y="145" font-size="16" fill="#66758a">Architecture direction</text><rect x="863" y="128" width="281" height="28" rx="14" fill="#eee9fb"/><circle cx="880" cy="142" r="3" fill="#7b61ad"/><text x="893" y="147" font-size="12" font-weight="600" fill="#6d529e">OpenAI extension planned</text>
<rect x="32" y="195" width="1136" height="254" rx="20" fill="#fff"/><rect x="56" y="217" width="34" height="34" rx="11" fill="#edf2f7"/><text x="73" y="239" text-anchor="middle" font-size="13" font-weight="600" fill="#526981">01</text><text x="106" y="232" font-size="21" font-weight="600" fill="#243145">Document preparation</text><text x="106" y="255" font-size="14" fill="#66758a">From scientific PDFs to searchable evidence.</text>
<rect x="56" y="277" width="320" height="76" rx="13" fill="#fff" stroke="#dbe1e8"/><text x="76" y="303" class="label" fill="#66758a">INPUT</text><text x="76" y="330" class="name" fill="#243145">PDF upload</text>
<rect x="440" y="277" width="320" height="76" rx="13" fill="#fff" stroke="#dbe1e8"/><text x="460" y="303" class="label" fill="#66758a">PARSE</text><text x="460" y="330" class="name" fill="#243145">Text extraction</text>
