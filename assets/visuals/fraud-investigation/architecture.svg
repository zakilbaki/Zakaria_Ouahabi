nt</text><path d="M244 460v42M756 460v42" stroke="#a6b7b4" stroke-width="2"/><rect x="70" y="502" width="348" height="76" rx="14" fill="#e4f1ee"/><text x="244" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#23534f">Authenticated Python APIs</text><text x="244" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#496e6b">Lookup · history · scoring · saved cases</text><rect x="582" y="502" width="348" height="76" rx="14" fill="#eeeaf6"/><text x="756" y="533" text-anchor="middle" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#514572">Versioned policy corpus</text><text x="756" y="558" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" fill="#71638d">Procedures · rules · citations</text></svg>
