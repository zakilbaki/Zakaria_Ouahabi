<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Bounded transaction evidence</title><desc id="d">Validated request passes through transaction lookup, strictly prior account history and model scoring; write operations remain separate.</desc><rect width="1000" height="620" rx="32" fill="#f5f7f8"/><text x="56" y="66" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#18766e">02 / EVIDENCE</text><text x="56" y="120" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18333b">Bounded tools keep facts traceable.</text><g font-family="Arial,sans-serif"><rect x="64" y="215" width="198" height="152" rx="18" fill="#fff" stroke="#d6e2e1"/><text x="163" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#71858a">REQUEST</text><text x="163" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#18333b">Transaction ID</text><text x="163" y="335" text-anchor="middle" font-size="14" fill="#657b80">Validated fields</text><rect x="300" y="215" width="198" height="152" rx="18" fill="#fff" stroke="#d6e2e1"/><text x="399" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#71858a">LOOKUP</text><text x="399" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#18333b">Transaction</text><text x="399" y="335" text-anchor="middle" font-size="14" fill="#657b80">Stable identifier</text><rect x="536" y="215" width="198" height="152" rx="18" fill="#fff" stroke="#d6e2e1"/><text x="635" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#71858a">HISTORY</text><text x="635" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#18333b">Earlier activity</text><text x="635" y="335" text-anchor="middle" font-size="14" fill="#657b80">Strictly before cutoff</text><rect x="772" y="215" width="164" height="152" rx="18" fill="#193c43"/><text x="854" y="260" text-anchor="middle" font-size="14" font-weight="700" fill="#96cdc5">SCORE</text><text x="854" y="302" text-anchor="middle" font-size="22" font-weight="700" fill="#fff">Frozen model</text><text x="854" y="335" text-anchor="middle" font-size="14" fill="#c0d5d2">Threshold + version</text><path d="M264 291h30M500 291h30M736 291h30" stroke="#809692" stroke-width="3"/><path d="m286 281 12 10-12 10m232-10 12-10-12-10m232 10 12-10-12-10" fill="none" stroke="#809692" stroke-width="3" transform="translate(0 20)"/><rect x="64" y="428" width="872" height="92" rx="18" fill="#e4f1ee"/><text x="96" y="468" font-family="Arial,sans-serif" font-size="18" font-weight="700" fill="#23534f">Case creation is a separate, explicit operation.</text><text x="96" y="496" font-family="Arial,sans-serif" font-size="15" fill="#496e6b">Read-only evidence lookup and scoring never save records implicitly.</text></g></svg>
