<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Chronological model protocol</title><desc id="d">PaySim steps separated into fit, threshold selection, development reserve and final test sets.</desc><rect width="1000" height="620" rx="32" fill="#f5f7f8"/><text x="56" y="66" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#18766e">03 / MODEL PROTOCOL</text><text x="56" y="120" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18333b">Freeze the policy before the final test.</text><text x="56" y="164" font-family="Arial,sans-serif" font-size="17" fill="#657b80">Synthetic PaySim steps · chronological partitions</text><g font-family="Arial,sans-serif"><rect x="56" y="230" width="300" height="166" rx="20" fill="#e8f0f5" stroke="#c8d8e0"/><text x="84" y="272" font-size="14" font-weight="700" letter-spacing="1" fill="#527486">FIT</text><text x="84" y="324" font-size="30" font-weight="700" fill="#18333b">Steps 1-360</text><text x="84" y="362" font-size="15" fill="#657b80">Estimate model parameters</text><rect x="370" y="230" width="188" height="166" rx="20" fill="#eeeaf6" stroke="#d8d0e7"/><text x="394" y="272" font-size="13" font-weight="700" letter-spacing="1" fill="#76648f">THRESHOLD</text><text x="394" y="324" font-size="26" font-weight="700" fill="#18333b">361-432</text><text x="394" y="362" font-size="15" fill="#657b80">Select operating point</text><rect x="572" y="230" width="188" height="166" rx="20" fill="#f7f0df" stroke="#e7d8af"/><text x="596" y="272" font-size="13" font-weight="700" letter-spacing="1" fill="#92783e">RESERVE</text><text x="596" y="324" font-size="26" font-weight="700" fill="#18333b">433-504</text><text x="596" y="362" font-size="15" fill="#657b80">Compare development choices</text><rect x="774" y="230" width="170" height="166" rx="20" fill="#e4f1ee" stroke="#c5ddd6"/><text x="798" y="272" font-size="13" font-weight="700" letter-spacing="1" fill="#397767">FINAL TEST</text><text x="798" y="324" font-size="26" font-weight="700" fill="#18333b">505-743</text><text x="798" y="362" font-size="15" fill="#657b80">Frozen model + policy</text><rect x="56" y="442" width="888" height="78" rx="18" fill="#193c43"/><text x="88" y="476" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1" fill="#96cdc5">FROZEN THRESHOLD</text><text x="88" y="504" font-family="Arial,sans-serif" font-size="21" font-weight="700" fill="#fff">0.312318</text><text x="320" y="494" font-family="Arial,sans-serif" font-size="16" fill="#c0d5d2">Final test steps are evaluated after the model and threshold are frozen.</text></g></svg>
