<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Fraud investigation workflow</title><desc id="d">Analyst request routed to specialist agents, transaction evidence and policy guidance.</desc><rect width="1000" height="620" rx="32" fill="#f1f5f5"/><text x="64" y="72" font-family="Arial,sans-serif" font-size="18" font-weight="700" letter-spacing="3" fill="#18766e">AI ENGINEERING / FRAUD INVESTIGATION</text><text x="64" y="137" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#18333b">Evidence before decisions.</text><text x="64" y="175" font-family="Arial,sans-serif" font-size="20" fill="#657b80">An analyst workflow grounded in transactions, scores and policy.</text><rect x="64" y="235" width="230" height="230" rx="22" fill="#fff" stroke="#d7e2e1"/><text x="92" y="280" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#71858a">ANALYST REQUEST</text><text x="92" y="333" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18333b">Investigate</text><text x="92" y="368" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#18333b">transaction</text><text x="92" y="422" font-family="Arial,sans-serif" font-size="15" fill="#657b80">ID · scope · evidence</text><path d="M310 350h66" stroke="#729490" stroke-width="3"/><path d="m366 340 12 10-12 10" fill="none" stroke="#729490" stroke-width="3"/><rect x="388" y="235" width="236" height="230" rx="22" fill="#193c43"/><text x="416" y="280" font-family="Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="1.5" fill="#96cdc5">COORDINATOR</text><text x="416" y="332" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">Route the</text><text x="416" y="367" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">right experts</text><text x="416" y="422" font-family="Arial,sans-serif" font-size="15" fill="#c0d5d2">Keep identifiers in context</text><path d="M640 350h66" stroke="#729490" stroke-width="3"/><path d="m696 340 12 10-12 10" fill="none" stroke="#729490" stroke-width="3"/><rect x="718" y="235" width="218" height="108" rx="18" fill="#fff" stroke="#d7e2e1"/><circle cx="752" cy="272" r="8" fill="#2f9e88"/><text x="776" y="278" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18333b">Transaction facts</text><text x="776" y="307" font-family="Arial,sans-serif" font-size="14" fill="#657b80">History · score · cases</text><rect x="718" y="365" width="218" height="100" rx="18" fill="#fff" stroke="#d7e2e1"/><circle cx="752" cy="401" r="8" fill="#8571b5"/><text x="776" y="407" font-family="Arial,sans-serif" font-size="19" font-weight="700" fill="#18333b">Policy guidance</text><text x="776" y="436" font-family="Arial,sans-serif" font-size="14" fill="#657b80">Versioned rules · citations</text><rect x="64" y="510" width="872" height="56" rx="14" fill="#dcebe8"/><text x="88" y="545" font-family="Arial,sans-serif" font-size="16" font-weight="700" fill="#23534f">Analyst stays in control</text><text x="306" y="545" font-family="Arial,sans-serif" font-size="16" fill="#496e6b">Scores support investigation; explicit requests govern saved case actions.</text></svg>
