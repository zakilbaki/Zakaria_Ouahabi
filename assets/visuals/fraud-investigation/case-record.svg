<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-labelledby="t d"><title id="t">Evidence-backed investigation record</title><desc id="d">Explicit case request creates recorded checks, which a versioned report references as evidence.</desc><rect width="1000" height="620" rx="32" fill="#f5f7f8"/><text x="56" y="66" font-family="Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="2" fill="#18766e">05 / CASE PROVENANCE</text><text x="56" y="120" font-family="Arial,sans-serif" font-size="36" font-weight="700" fill="#18333b">Keep the investigation reviewable.</text><g font-family="Arial,sans-serif"><rect x="72" y="224" width="238" height="194" rx="20" fill="#fff" stroke="#d6e2e1"/><circle cx="116" cy="270" r="20" fill="#e4f1ee"/><path d="M108 270h16M116 262v16" stroke="#2f9e88" stroke-width="3"/><text x="104" y="326" font-size="14" font-weight="700" fill="#71858a">EXPLICIT REQUEST</text><text x="104" y="362" font-size="22" font-weight="700" fill="#18333b">Save investigation</text><text x="104" y="393" font-size="14" fill="#657b80">Stable retry key</text><path d="M324 320h52" stroke="#809692" stroke-width="3"/><path d="m366 310 12 10-12 10" fill="none" stroke="#809692" stroke-width="3"/><rect x="390" y="224" width="238" height="194" rx="20" fill="#e4f1ee" stroke="#c5ddd6"/><circle cx="434" cy="270" r="20" fill="#cce3dc"/><path d="m425 270 6 6 13-14" fill="none" stroke="#2f9e88" stroke-width="3"/><text x="422" y="326" font-size="14" font-weight="700" fill="#397767">RECORDED CHECKS</text><text x="422" y="362" font-size="22" font-weight="700" fill="#18333b">Evidence snapshots</text><text x="422" y="393" font-size="14" fill="#657b80">Execution IDs · versions</text><path d="M642 320h52" stroke="#809692" stroke-width="3"/><path d="m684 310 12 10-12 10" fill="none" stroke="#809692" stroke-width="3"/><rect x="708" y="224" width="220" height="194" rx="20" fill="#193c43"/><text x="740" y="276" font-size="14" font-weight="700" letter-spacing="1" fill="#96cdc5">VERSIONED REPORT</text><text x="740" y="330" font-size="23" font-weight="700" fill="#fff">JSON + Markdown</text><text x="740" y="371" font-size="15" fill="#c0d5d2">References recorded checks</text><rect x="72" y="468" width="856" height="66" rx="16" fill="#eeeaf6"/><text x="104" y="509" font-size="17" font-weight="700" fill="#514572">20 documented evaluation scenarios</text><text x="433" y="509" font-size="15" fill="#71638d">Routing expectations, not a measured pass rate.</text></g></svg>
