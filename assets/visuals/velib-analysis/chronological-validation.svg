<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="850" viewBox="0 0 1100 850" role="img" aria-labelledby="title desc"><title id="title">Vélib: chronological validation</title><desc id="desc">Training January 1 to March 11, validation March 11 to 13, test March 13 to 16. Three hourly lags and current observations predict bike availability one hour ahead. The periods are schematic and not drawn to scale.</desc><defs><style>text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif}.label{font-size:12px;font-weight:600;letter-spacing:1px}.muted{fill:#66758a}</style><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto"><path d="M1 1 6 4 1 7" stroke="#8a96a7" fill="none" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect x="1" y="1" width="1098" height="848" rx="28" fill="#f6f7f9" stroke="#e0e5eb"/>
<text x="52" y="54" class="label" fill="#426b93">VÉLIB / MODEL VALIDATION</text>
<text x="52" y="107" font-size="38" font-weight="650" letter-spacing="-1.2" fill="#243145">Learn from the past. Evaluate on the future.</text>
<text x="52" y="144" font-size="17" class="muted">Chronological splits keep the test period unseen.</text>
<rect x="32" y="184" width="1036" height="296" rx="22" fill="#fff"/>
<rect x="56" y="208" width="34" height="34" rx="11" fill="#edf2f7"/><text x="73" y="230" text-anchor="middle" font-size="13" font-weight="600" fill="#526981">01</text><text x="106" y="232" font-size="21" font-weight="600" fill="#243145">A chronological split</text>
<rect x="56" y="266" width="312" height="155" rx="15" fill="#edf5fa" stroke="#cbdde9"/><text x="76" y="295" class="label" fill="#386c8c">LEARN</text><text x="76" y="331" font-size="27" font-weight="600" fill="#243145">Train</text><text x="76" y="366" font-size="18" fill="#34455b">Jan 01 → Mar 11</text><text x="76" y="396" font-size="14" class="muted">Fit the model</text><rect x="394" y="266" width="312" height="155" rx="15" fill="#f1edfa" stroke="#d9ceed"/><text x="414" y="295" class="label" fill="#7859a3">SELECT</text><text x="414" y="331" font-size="27" font-weight="600" fill="#243145">Validate</text><text x="414" y="366" font-size="18" fill="#34455b">Mar 11 → Mar 13</text><text x="414" y="396" font-size="14" class="muted">Compare models</text><rect x="732" y="266" width="312" height="155" rx="15" fill="#edf6f1" stroke="#cce3d6"/><text x="752" y="295" class="label" fill="#3c7659">EVALUATE</text><text x="752" y="331" font-size="27" font-weight="600" fill="#243145">Test</text><text x="752" y="366" font-size="18" fill="#34455b">Mar 13 → Mar 16</text><text x="752" y="396" font-size="14" class="muted">Measure future error</text><path d="M56 451 H653" stroke="#b3becb" stroke-width="1.5" marker-end="url(#arrow)"/><text x="56" y="442" font-size="11" class="muted">EARLIER</text><text x="653" y="442" text-anchor="end" font-size="11" class="muted">LATER</text><text x="1044" y="453" text-anchor="end" font-size="12" class="muted">Schematic · not to scale</text>
<rect x="32" y="504" width="1036" height="239" rx="22" fill="#fff"/>
<rect x="56" y="528" width="34" height="34" rx="11" fill="#edf2f7"/><text x="73" y="550" text-anchor="middle" font-size="13" font-weight="600" fill="#526981">02</text><text x="106" y="552" font-size="21" font-weight="600" fill="#243145">One station. One-hour horizon.</text>
<text x="56" y="597" class="label" fill="#66758a">AVAILABLE AT PREDICTION TIME</text>
<rect x="56" y="613" width="142" height="55" rx="12" fill="#f6f7f9" stroke="#dbe1e8"/><text x="127" y="647" text-anchor="middle" font-size="20" font-weight="400" fill="#34455b">t−3h</text><path d="M204 640 h12" stroke="#8a96a7" marker-end="url(#arrow)"/><rect x="222" y="613" width="142" height="55" rx="12" fill="#f6f7f9" stroke="#dbe1e8"/><text x="293" y="647" text-anchor="middle" font-size="20" font-weight="400" fill="#34455b">t−2h</text><path d="M370 640 h12" stroke="#8a96a7" marker-end="url(#arrow)"/><rect x="388" y="613" width="142" height="55" rx="12" fill="#f6f7f9" stroke="#dbe1e8"/><text x="459" y="647" text-anchor="middle" font-size="20" font-weight="400" fill="#34455b">t−1h</text><path d="M536 640 h12" stroke="#8a96a7" marker-end="url(#arrow)"/><rect x="554" y="613" width="142" height="55" rx="12" fill="#edf5fa" stroke="#dbe1e8"/><text x="625" y="647" text-anchor="middle" font-size="20" font-weight="600" fill="#34455b">Now</text><text x="56" y="702" font-size="14" class="muted">Three hourly lags + recent changes</text><path d="M725 584 V715" stroke="#ccd5e0" stroke-dasharray="4 5"/><path d="M749 641 H798" stroke="#8a96a7" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="822" y="580" width="222" height="135" rx="15" fill="#edf6f1" stroke="#cce3d6"/><text x="844" y="609" class="label" fill="#3c7659">PREDICT</text><text x="844" y="652" font-size="38" font-weight="600" fill="#243145">+1h</text><text x="844" y="688" font-size="15" fill="#3c7659">Bike availability</text>
<circle cx="66" cy="792" r="13" fill="#edf6f1"/><path d="m60 792 4 4 8-9" fill="none" stroke="#3c7659" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="94" y="797" font-size="15" class="muted"><tspan font-weight="600" fill="#34455b">Past-only features.</tspan> Future observations are never used to construct the inputs.</text></svg>